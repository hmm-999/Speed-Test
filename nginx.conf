# Plain HTTP only; TLS terminates at the reverse proxy in front.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log off;
    server_tokens off;
    sendfile on;
    tcp_nodelay on;

    # Uploads POST to the static /upload file; answer 200 instead of 405.
    client_max_body_size 35m;
    error_page 405 =200 $uri;

    # A cached download or ping measures the browser, not the network.
    location / {
        add_header Cache-Control "no-store, no-cache, max-age=0, no-transform" always;
        etag off;
        if_modified_since off;
    }
}
