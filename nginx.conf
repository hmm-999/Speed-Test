# Plain HTTP only; TLS terminates at the reverse proxy in front.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log off;
    server_tokens off;
    sendfile on;
    tcp_nodelay on;

    client_max_body_size 35m;

    # A cached download or ping measures the browser, not the network.
    add_header Cache-Control "no-store, no-cache, max-age=0, no-transform" always;
    etag off;
    if_modified_since off;

    # Answer an upload only after its whole body has arrived. Behind an
    # HTTP/2 proxy an early 200 ends the upload short and inflates the
    # result; upstream's HTTP/2 fix. The cost is buffering each body to
    # /tmp, which can cap results below the network's real limit.
    location = /upload {
        # Buffering every body is expected; skip the warning it logs.
        error_log /var/log/nginx/error.log error;
        proxy_pass http://127.0.0.1:8080/dev-null;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location = /dev-null {
        return 200;
    }
}
