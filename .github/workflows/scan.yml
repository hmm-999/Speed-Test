name: scan

# Rescans the published image for newly disclosed vulnerabilities without
# rebuilding it. A failure means a fixable issue exists; push to rebuild.
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Scan published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/speed-test:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
